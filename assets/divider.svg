<svg width="1200" height="6" viewBox="0 0 1200 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" fill="#161b22"/>
  <rect width="320" height="6" fill="url(#shimmer)">
    <animate attributeName="x" from="-320" to="1200" dur="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>
